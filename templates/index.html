<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    
</head>
<body>
    <div id="edit-expense-form-div" >
        <div class="edit-modal-content">
            <h1>Edit Expense</h1>
            <form id="edit-expense-form">   
                <input type="hidden" id="edit-id" name="id">

                <label for="edit-description">Description:</label>
                <input type="text" id="edit-description" name="description" required><br>
                
                <label for="edit-amount">Amount:</label>
                <input type="number" id="edit-amount" name="amount" required><br>

                <label for="edit-paid_by">Paid By:</label>
                <input type="text" id="edit-paid_by" name="paid_by" required><br>

                <button type="submit">Update Expense</button>
                <button type="button" id="edit-cancel-button">Cancel</button>   
            </form>

        </div>



    </div>




    <div class="container">

        <h1>Expense Tracker</h1>

        <form id ="expense-form">
            <label for="description">Description:</label>
            <input type="text" id="description" name="description" required><br>
            
            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="amount" required><br>

            <label for="paid_by">Paid By:</label>
            <input type="text" id="paid_by" name="paid_by" required><br>

            <button type="submit">Add Expense</button>
        </form>

        <div id="expenses-list">
        </div>
    </div>


    <script src="/static/app.js"></script>
</body>
</html>
